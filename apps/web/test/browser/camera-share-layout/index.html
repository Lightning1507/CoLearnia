<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCRUM-78 · Share stage và camera rail</title>
    <style>
      body {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
      }
      #root {
        display: flex;
        flex: 1;
      }
      #root > .workspace-shell {
        min-height: 0;
        flex: 1;
      }
      .camera-layout-tools {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 20;
        max-width: min(420px, calc(100vw - 24px));
        padding: 8px 12px;
        border: 1px solid #dfe4e2;
        border-radius: 8px;
        background: #fff;
        color: #52605c;
        font:
          12px/1.5 system-ui,
          sans-serif;
      }
      .camera-layout-tools[open] {
        max-height: 50dvh;
        overflow-y: auto;
      }
      .camera-layout-tools summary {
        cursor: pointer;
      }
      #fixture-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <details class="camera-layout-tools">
      <summary>Dữ liệu mô phỏng · Kiểm thử</summary>
      <p>
        SCRUM-78 · RoomShell/WorkspaceShell thật, snapshot và thiết bị mô phỏng, video canvas. Không
        phải kiểm SFU/TURN.
      </p>
      <output id="result" role="status">Đang kiểm bố cục…</output>
      <div id="fixture-controls"></div>
    </details>
    <script type="module" src="./cameraShareLayoutFixture.tsx"></script>
  </body>
</html>
