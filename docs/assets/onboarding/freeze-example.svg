<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Freeze giữ hình cho nhóm, không dừng lớp</title><desc id="desc">Cả lớp chuyển tới slide 6 trong khi một nhóm DISCUSSION giữ slide 5 và vẽ. Resume trở lại hình hiện tại.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#91aaa2"/></marker></defs><rect width="1000" height="450" fill="#fff"/><g font-family="Arial, sans-serif" fill="#183b38">
<text x="32" y="38" font-size="26" fill="#183b38" text-anchor="start" font-weight="700">Freeze: giữ chỗ đang giải, bài giảng vẫn tiếp tục</text>
<rect x="32" y="75" width="285" height="90" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="50" y="107" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">1. Cùng xem slide 5</text>
<text x="50" y="138" font-size="18" fill="#536863" text-anchor="start" font-weight="400">MAIN và nhóm cùng xem</text>
<polyline points="317,120 349,120" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="365" y="75" width="603" height="90" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="383" y="107" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">2. Nhóm DISCUSSION bấm dừng hình</text>
<text x="383" y="138" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Chỉ nhóm giữ ảnh slide 5 • âm thanh vẫn tiếp tục</text>
<polyline points="665,165 665,193 255,193 255,228" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="665,193 745,193 745,228" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="228" width="450" height="105" rx="12" fill="#f2f5fb" stroke="#b5d4ca"/>
<text x="50" y="260" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">Ở MAIN: bài giảng tới slide 6</text>
<text x="50" y="291" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Cả lớp tiếp tục học</text>
<text x="50" y="317" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Không bị nhóm dừng màn hình</text>
<rect x="518" y="228" width="450" height="105" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="536" y="260" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">Ở nhóm: vẫn giải thích trên slide 5</text>
<text x="536" y="291" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Cùng nhìn ảnh, cùng vẽ lời giải</text>
<text x="536" y="317" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Các nhóm khác không bị ảnh hưởng</text>
<polyline points="745,333 745,365" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="391" font-size="19" fill="#536863" text-anchor="start" font-weight="400">Resume không phát lại đoạn đã bỏ qua.</text>
<rect x="518" y="365" width="450" height="70" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="536" y="397" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">3. Resume → xem hình trực tiếp lúc đó</text>
</g></svg>