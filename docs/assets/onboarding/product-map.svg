<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Một Workspace, nhiều cách học</title><desc id="desc">Workspace chứa kênh TEXT, DM và kênh LIVE. Một phiên trong LIVE có MAIN và nhóm DISCUSSION hoặc ACTIVITY.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#91aaa2"/></marker></defs><rect width="1000" height="530" fill="#fff"/><g font-family="Arial, sans-serif" fill="#183b38">
<text x="32" y="38" font-size="26" fill="#183b38" text-anchor="start" font-weight="700">Một Workspace, nhiều cách học</text>
<rect x="325" y="65" width="350" height="84" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="343" y="97" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">Workspace “Công nghệ Web”</text>
<text x="343" y="128" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Thành viên: owner / admin / member</text>
<polyline points="500,149 500,176 178,176 178,200" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,176 500,200" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,176 822,176 822,200" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="200" width="300" height="110" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="46" y="232" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">Kênh TEXT</text>
<text x="46" y="263" font-size="18" fill="#536863" text-anchor="start" font-weight="400">general, bài-tập…</text>
<text x="46" y="289" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Chat • thread • ảnh/tệp</text>
<rect x="350" y="200" width="300" height="110" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="368" y="232" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">DM 1–1</text>
<text x="368" y="263" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Hai thành viên cùng Workspace</text>
<text x="368" y="289" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Tin riêng • ảnh/tệp</text>
<rect x="672" y="200" width="300" height="110" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="690" y="232" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">Kênh LIVE</text>
<text x="690" y="263" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Kênh tồn tại lâu dài</text>
<text x="690" y="289" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Mở một phiên họp khi cần</text>
<polyline points="822,310 822,345" fill="none" stroke="#91aaa2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="345" width="622" height="135" rx="12" fill="#eef8f4" stroke="#b5d4ca"/>
<text x="368" y="377" font-size="21" fill="#183b38" text-anchor="start" font-weight="700">Phiên họp đang diễn ra</text>
<text x="368" y="408" font-size="18" fill="#536863" text-anchor="start" font-weight="400">MAIN: phòng chung</text>
<text x="368" y="434" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Nhóm DISCUSSION hoặc ACTIVITY trong phiên</text>
<text x="368" y="460" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Kết thúc phiên không xóa kênh hoặc Workspace</text>
<text x="32" y="510" font-size="18" fill="#536863" text-anchor="start" font-weight="400">Nhóm nhỏ nằm trong phiên họp; không phải kênh mới.</text>
</g></svg>