name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm media:smoke
      - run: docker compose config --quiet
      - run: pnpm infra:up
      - name: Verify MongoDB replica set primary
        run: docker compose exec -T mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary || db.hello().setName !== "rs0") quit(1)'
      - name: Verify transaction commit and rollback
        run: docker compose exec -T mongo mongosh --quiet < infra/mongo/verify-transactions.js
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose down

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Validate commits in pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 "$base/$archive" --output "$archive"
          curl --fail --location --retry 3 "$base/$checksums" --output "$checksums"
          grep " $archive\$" "$checksums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"'

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect deployment changes
        id: changes
        run: node scripts/docker-smoke-required.mjs
      - name: Set up Docker Buildx
        if: steps.changes.outputs.required == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build images with layer cache
        if: steps.changes.outputs.required == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: |
            server
            web
          load: true
          set: |
            server.tags=colearnia-server:latest
            web.tags=colearnia-web:latest
            server.cache-from=type=gha,scope=colearnia-server
            server.cache-to=type=gha,mode=max,scope=colearnia-server
            web.cache-from=type=gha,scope=colearnia-web
            web.cache-to=type=gha,mode=max,scope=colearnia-web
      - name: Start local application stack
        if: steps.changes.outputs.required == 'true'
        run: docker compose --profile app up --no-build --detach --wait --wait-timeout 180
      - name: Verify web and API through Nginx
        if: steps.changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/ | grep -q 'CoLearnia'
          curl --fail --silent http://localhost:8080/health/ready
          curl --fail --silent http://localhost:8080/api/v1/system/status | python3 -c 'import sys,json; s=json.load(sys.stdin)["data"]; assert s["name"]=="CoLearnia" and s["ready"] is True'
      - name: Container logs
        if: failure() && steps.changes.outputs.required == 'true'
        run: docker compose --profile app logs --no-color
      - name: Stop application stack
        if: always() && steps.changes.outputs.required == 'true'
        run: docker compose --profile app down
