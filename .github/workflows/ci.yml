name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm media:smoke
      - run: docker compose config --quiet
      - run: pnpm infra:up
      - name: Verify replica set transaction support
        run: docker compose exec -T mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary || db.hello().setName !== "rs0") quit(1)'
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose down
