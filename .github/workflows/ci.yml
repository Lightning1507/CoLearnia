name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm media:smoke
      - run: docker compose config --quiet
      - run: pnpm infra:up
      - name: Verify MongoDB replica set primary
        run: docker compose exec -T mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary || db.hello().setName !== "rs0") quit(1)'
      - name: Verify transaction commit and rollback
        run: docker compose exec -T mongo mongosh --quiet < infra/mongo/verify-transactions.js
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose down

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate commits in pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 "$base/$archive" --output "$archive"
          curl --fail --location --retry 3 "$base/$checksums" --output "$checksums"
          grep " $archive\$" "$checksums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"'

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images and start local application stack
        run: docker compose --profile app up --build --detach --wait --wait-timeout 180
      - name: Verify web and API through Nginx
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/ | grep -q 'CoLearnia'
          curl --fail --silent http://localhost:8080/health/ready
          curl --fail --silent http://localhost:8080/api/v1/system/status | python3 -c 'import sys,json; s=json.load(sys.stdin)["data"]; assert s["name"]=="CoLearnia" and s["ready"] is True'
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose --profile app down
