version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(deps)'
  - package-ecosystem: docker
    directories:
      - /apps/server
      - /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(docker)'
