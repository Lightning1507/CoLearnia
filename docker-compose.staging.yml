name: colearnia-staging

# Standalone staging configuration. The private Mongo replica set is provisioned by SCRUM-55.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      MONGO_URI: ${MONGO_URI:?Provide the authenticated staging database URI}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-604800}
      AUTH_TRUST_PROXY: 'true'
      MEDIA_ENABLED: 'true'
      MEDIA_LISTEN_IP: 0.0.0.0
      MEDIA_ANNOUNCED_ADDRESS: ${MEDIA_ANNOUNCED_ADDRESS:?Set the public media address}
      MEDIA_PORT: '40000'
    ports:
      - '40000:40000/udp'
      - '40000:40000/tcp'
    networks:
      - default
      - database
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '443:443/tcp'
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./infra/nginx/staging.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGING_TLS_CERT_FILE:?Provide the path to the TLS full chain}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGING_TLS_KEY_FILE:?Provide the path to the TLS private key}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false

networks:
  database:
    external: true
    name: ${STAGING_DB_NETWORK:?Provide the private Docker network for staging MongoDB}
